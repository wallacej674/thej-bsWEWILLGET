name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: applytogether_test
          POSTGRES_USER: applytogether_test
          POSTGRES_PASSWORD: applytogether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=applytogether_test --dbname=applytogether_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEV_IDENTITY_HEADER_ENABLED: "true"
      AUTH_JWT_SECRET_KEY: test-only-authx-signing-secret-change-me
      DATABASE_URL: postgresql+psycopg://applytogether_test:applytogether_test@127.0.0.1:5432/applytogether_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Audit dependencies
        run: |
          uv export --frozen --no-hashes --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run python -m pytest
